name: Build (Artifacts only)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      # Si quieres asegurar que el lock esté respetado (opcional)
      - name: Sync (optional)
        run: uv sync --frozen

      - name: Build package (sdist + wheel)
        run: uv build

      - name: Upload dist as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
